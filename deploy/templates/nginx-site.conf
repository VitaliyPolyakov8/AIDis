# AIDis on __DOMAIN__ (written by deploy/setup.sh from deploy/templates/nginx-site.conf).
# certbot adds the HTTPS parts (listen 443, certificates, redirect from http) to this file.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The backend checks upload sizes itself (MAX_UPLOAD_SIZE / MAX_LARGE_UPLOAD_SIZE in .env).
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Overwrite (not append) so clients cannot fake their address for rate limiting.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;

    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads straight to the backend instead of buffering them on disk.
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
    }

    # The web client (a single-page app).
    root __WEB_DIR__;
    index index.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# voice-begin

# Voice (LiveKit signaling over WebSocket).
server {
    listen 80;
    listen [::]:80;
    server_name rtc.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__LIVEKIT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# voice-end
