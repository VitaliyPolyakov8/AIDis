<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS from zooming into text fields on focus (pinch zoom still works). -->

    <meta name="theme-color" content="#15171c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AIDis: private chat and voice for friends." />
    <meta name="referrer" content="no-referrer" />
    <!-- 0.5.9 iPhone / iPad home-screen app (PWA): full screen, dark status bar over the app. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIDis" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AIDis</title>
